[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-own-accelerator"
version = "0.1.0"
description = "Minimal empty project scaffold"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "pyrefly",
    "pytest>=7",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["my_own_accelerator*"]

[tool.pytest.ini_options]
testpaths = ["unittests"]

[tool.black]
line-length = 98

[tool.ruff]
line-length = 98

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
ignore_missing_imports = true

[tool.pyrefly]
project-includes = ["my_own_accelerator/**/*.py"]
