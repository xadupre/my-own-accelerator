[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-own-accelerator"
version = "0.1.0"
description = "Minimal empty project scaffold"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
review-pr = "moa.commands.review_pr:main"
review-local = "moa.commands.review_local:main"

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "pyrefly",
    "pytest>=7",
    "ruff",
]
docs = [
    "matplotlib",
    "pydata-sphinx-theme",
    "sphinx>=7",
    "sphinx-copybutton",
    "sphinx-gallery",
    "sphinx-issues",
    "sphinx-runpython",
    "sphinxcontrib-mermaid",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["moa*"]

[tool.pytest.ini_options]
testpaths = ["unittests"]

[tool.black]
line-length = 98

[tool.ruff]
line-length = 98

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
ignore_missing_imports = true

[tool.pyrefly]
project-includes = ["moa/**/*.py"]
